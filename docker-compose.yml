version: "3.9"

services:
  postgres:
    image: timescale/timescaledb-ha:pg16-latest   # includes pgvector + TimescaleDB
    container_name: shoescout_postgres
    environment:
      POSTGRES_DB: shoescout
      POSTGRES_USER: shoescout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoescout -d shoescout"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: shoescout_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    # GPU passthrough — uncomment if you have an NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  pgdata:
  ollamadata:
